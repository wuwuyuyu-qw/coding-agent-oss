; ============================================================
; pytest.ini —— 单测工程配置 + 覆盖率门槛
;
; [Design Rationale] 为什么把配置塞 pytest.ini？
;   - 本项目还没 pyproject；
;   - pytest.ini 优先级最高；
;   - 单文件更直观，演示与协作成本低。
; ============================================================
[pytest]
minversion = 7.0
asyncio_mode = auto

; 只从 tests/ 收集用例，避免误扫 .venv / core/ 里的 __pycache__
testpaths = tests

; addopts 解析：
;   -ra                   : 每次 summary 打印所有非通过结果（R=report, a=all but passed）
;   --strict-markers      : 未注册的 @pytest.mark.xxx 直接报错，防静默失效
;   --tb=short            : 简洁 traceback
;   --cov=core --cov=main : 采集这两个包的覆盖率
;   --cov-report=term-missing : 终端打印缺失行号，快速定位
;   --cov-report=html:htmlcov : 同时生成 HTML 报告，方便本地浏览
;   --cov-branch          : 分支覆盖（条件的真假都要走过）
;   --cov-fail-under=80   : 覆盖率 <80% 直接让 pytest 退出码非 0，
;                           这一行让覆盖率从"度量指标"升级为"质量门禁"
addopts =
    -ra
    --strict-markers
    --tb=short
    --cov=core
    --cov=main
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-branch
    --cov-fail-under=80

; 标准 Python 测试文件/类/函数命名
python_files = test_*.py
python_classes = Test*
python_functions = test_*
